<!doctype html>
<html lang="uk">
<head><meta charset="utf-8"><title>Шаблон сторінки після надсилання форми (перефразований)</title></head>
<body>
<header><nav><a href="/uk/">Головна</a> <button>Вийти</button></nav></header>
<main>
  <h1>Вітаємо! Ваш товар додано</h1>
  <p>Просуньте оголошення, щоб його побачило більше покупців.</p>
  <section class="promo">
    <button class="promo-pay">Оплатити рекламу</button>
    <button class="promo-lift">Підняти оголошення</button>
    <button class="promo-buy">Купити просування</button>
    <a class="promo-link" href="/uk/promo">Реклама оголошення</a>
  </section>
  <button class="close" aria-label="Закрити">×</button>
  <button class="later">Пізніше</button>
  <a class="next" href="/uk/new">Додати ще один товар</a>
</main>
</body>
</html>

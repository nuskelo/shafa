<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>Проблеми · Шафа-помічник</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F6F3}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div style="min-height: 100vh; background: #F6F6F3; font-family: Inter, system-ui, sans-serif; color: #1A1A18; font-size: 15px; line-height: 1.45">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E4E3DE">
    <div style="max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; min-height: 64px">
      <div style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em">Шафа-помічник</div>
      <nav aria-label="Розділи" style="display: flex; gap: 4px; flex-wrap: wrap; flex: 1 1 auto">
        <a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; color: #3D3D39; font-weight: 500; text-decoration: none">На перевірку <span style="background: #EDECE8; border-radius: 999px; padding: 1px 8px; font-size: 13px">8</span></a>
        <a href="#" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; color: #3D3D39; font-weight: 500; text-decoration: none">Схвалені <span style="background: #EDECE8; border-radius: 999px; padding: 1px 8px; font-size: 13px">1</span></a>
        <a href="Problems.dc.html" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: #FDECEA; color: #A3211A; font-weight: 600; text-decoration: none">Проблеми <span style="background: #A3211A; color: #FFFFFF; border-radius: 999px; padding: 1px 8px; font-size: 13px">4</span></a>
        <a href="#" style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; color: #3D3D39; font-weight: 500; text-decoration: none">Опубліковані <span style="background: #EDECE8; border-radius: 999px; padding: 1px 8px; font-size: 13px">62</span></a>
        <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border-radius: 10px; border: 0; background: transparent; color: #3D3D39; font: inherit; font-weight: 500; cursor: pointer">Ще
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
      </nav>
    </div>
  </header>

  <main style="max-width: 1280px; margin: 0 auto; padding: 20px 24px 48px; display: flex; flex-direction: column; gap: 16px">
    <div>
      <h1 style="margin: 0; font-size: 26px; letter-spacing: -0.02em">Проблеми</h1>
      <p style="margin: 4px 0 0; color: #5F5F5A">Картки, які робот не публікує. Кожна — з причиною і що зробити.</p>
    </div>

    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border: 1px solid #E4E3DE; border-radius: 14px; padding: 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
        <div style="width: 96px; height: 96px; flex: none; border-radius: 10px; background: #ECEBE6; display: flex; align-items: center; justify-content: center; color: #6E6E68; font-size: 12px; text-align: center">фото<br>{{ r.post }}</div>
        <div style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap">
            <span style="{{ r.tagStyle }}">{{ r.tag }}</span>
            <span style="font-size: 13px; color: #5F5F5A">Пост {{ r.post }} · {{ r.date }}</span>
          </div>
          <div style="font-weight: 600">{{ r.title }}</div>
          <div style="color: #3D3D39">{{ r.why }}</div>
          <div style="font-size: 14px; color: #5F5F5A">Що робити: {{ r.todo }}</div>
        </div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <a href="Card.dc.html" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #D6D5CF; background: #FFFFFF; color: #1A1A18; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center">Відкрити Картку</a>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid #D6D5CF; background: #FFFFFF; font: inherit; font-weight: 500; cursor: pointer">В архів</button>
          <button type="button" style="min-height: 44px; padding: 0 16px; border-radius: 10px; border: 0; background: #1F4FD1; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Перевірити ще раз</button>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

  renderVals() {
    const tag = 'padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; ';
    const orange = tag + 'background: #FDEBDD; color: #8A3A0A';
    const red = tag + 'background: #FDECEA; color: #A3211A';
    const rows = [
      { post: 3654, date: '30.11.2025', title: 'Нові термо черевики Peter Storm, 43 розмір', tag: 'Кілька розмірів', tagStyle: orange,
        why: 'У пості кілька розмірів — схоже, кілька товарів.', todo: 'опублікуй вручну або в архів.' },
      { post: 3655, date: '30.11.2025', title: 'Нові замшеві термо черевики Peter Storm, 36 і 37', tag: 'Кілька розмірів', tagStyle: orange,
        why: 'У пості кілька розмірів — схоже, кілька товарів.', todo: 'опублікуй вручну або в архів.' },
      { post: 3659, date: '30.11.2025', title: 'Папка borh-3659', tag: 'Кілька товарів', tagStyle: orange,
        why: 'У пості кілька товарів з різними цінами.', todo: 'опублікуй вручну або в архів.' },
      { post: 6453, date: '02.09.2026', title: 'Термокофта Mountain Warehouse в новому стані', tag: 'Нема розділу', tagStyle: red,
        why: 'На Шафі немає підходящого розділу (окуляри, парасольки, шкарпетки тощо).', todo: 'в архів.' }
    ];
    return { rows };
  }
}
</script>
</body>
</html>

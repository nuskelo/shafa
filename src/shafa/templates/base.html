<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Шафа-помічник{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <nav class="tabs">
    {% for status, title in tabs.items() %}
    <a href="/{{ status }}" class="tab{% if status == current %} current{% endif %}">{{ title }} <span class="count">{{ counts[status] }}</span></a>
    {% endfor %}
  </nav>
  {% if counts["new"] %}
  <p class="waiting">Чекають ШІ: {{ counts["new"] }}</p>
  {% endif %}
</header>
{% if message %}
<p class="message">{{ message }}</p>
{% endif %}
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>

<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Шафа-помічник{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg">
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <nav class="tabs">
    {% for status, title in tabs.items() %}
    <a href="/{{ status }}" class="tab{% if status == current %} current{% endif %}">{{ title }} <span class="count">{{ counts[status] }}</span></a>
    {% endfor %}
  </nav>
  {% if can_quit %}
  <form method="post" action="/quit" class="quit">
    <input type="hidden" name="token" value="{{ token }}">
    <button title="Закрити програму: екран і бота">Вийти</button>
  </form>
  {% endif %}
</header>
<div id="robot" data-panel="/robot/panel?back={{ back | urlencode }}">
{% include "panel.html" %}
</div>
{% if message %}
<p class="message">{{ message }}</p>
{% endif %}
<main>
{% block main %}{% endblock %}
</main>
</body>
</html>

<div class="status mini" aria-label="Стан програми" aria-live="polite">
  {% if fake %}<span class="fake">ПІДСТАВНИЙ КЛУБОК</span>{% endif %}
  <span class="mini-item robot robot-{{ kpanel.code }}" title="{{ kpanel.text }} · Сьогодні на Клубку {{ kpanel.shown_started }} з {{ kpanel.day_limit }} · Схвалених {{ kpanel.queued }}"><span class="dot dot-{{ ktone }}" aria-hidden="true"></span>{{ kpanel.mini }}</span>
  {% if "stop" in kpanel.buttons %}
  <form method="post" action="/klubok/robot" class="mini-stop">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="back" value="{{ back }}">
    <button name="action" value="stop" class="reject">Стоп</button>
  </form>
  {% endif %}
  {% if ai is defined %}<span class="mini-item ai" title="Готові йти на ШІ: {{ ai.ready }} · ШІ зараз заповнює: {{ ai.pending }}{% if ai.note %} · {{ ai.note }}{% endif %}"><span class="dot dot-{{ tones.ai }}" aria-hidden="true"></span>ШІ{% if ai.busy %}: {{ ai.busy }}{% endif %}</span>
  <span class="mini-item bot-{{ bot.code }}" title="{{ bot.text }}"><span class="dot dot-{{ tones.bot }}" aria-hidden="true"></span>Бот</span>{% endif %}
</div>
{% if counts %}<span hidden data-counts="{% for key, value in counts.items() %}{{ key }}={{ value }};{% endfor %}"></span>{% endif %}

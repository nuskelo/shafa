<div class="status mini" aria-label="Стан програми" aria-live="polite">
  {% if fake %}<span class="fake">ПІДСТАВНА ШАФА</span>{% endif %}
  <span class="mini-item robot robot-{{ robot.code }}" title="{{ robot.groups_text }} · Схвалених {{ robot.approved }}"><span class="dot dot-{{ tones.robot }}" aria-hidden="true"></span>{{ robot.mini or robot.text }}</span>
  {% if "stop" in robot.buttons %}
  <form method="post" action="/robot" class="mini-stop">
    <input type="hidden" name="token" value="{{ token }}">
    <input type="hidden" name="back" value="{{ back }}">
    <button name="action" value="stop" class="reject">Стоп</button>
  </form>
  {% endif %}
  <span class="mini-item ai" title="Чекають на ШІ: {{ ai.ready }} · ШІ зараз заповнює: {{ ai.pending }}{% if ai.note %} · {{ ai.note }}{% endif %}"><span class="dot dot-{{ tones.ai }}" aria-hidden="true"></span>ШІ{% if ai.busy %}: {{ ai.busy }}{% endif %}</span>
  <span class="mini-item bot-{{ bot.code }}" title="{{ bot.text }}"><span class="dot dot-{{ tones.bot }}" aria-hidden="true"></span>Бот</span>
  {% if site %}<span class="mini-item" title="чекає {{ site[0] }} · вийде сьогодні {{ site[1] }}"><span class="dot dot-{{ tones.site }}" aria-hidden="true"></span>Сайт</span>{% endif %}
</div>
{% if counts %}<span hidden data-counts="{% for key, value in counts.items() %}{{ key }}={{ value }};{% endfor %}"></span>{% endif %}

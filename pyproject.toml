[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shafa"
version = "0.1.0"
description = "Шафа-помічник: пости Telegram-каналу → оголошення на Shafa.ua"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic==1.9.0",
    "greenlet==3.5.6",  # підзалежність playwright, закріплена (D1)
    "Jinja2==3.1.6",
    "MarkupSafe==3.0.3",
    "Pillow==12.3.0",
    "playwright==1.63.0",
    "pyee==13.0.1",  # підзалежність playwright, закріплена (D1)
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Лише Python: ruff ≥ 0.16 інакше форматує код у .md (документи Архітектора не чіпаємо).
include = ["*.py", "*.pyi", "**/pyproject.toml"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.setuptools.package-data]
shafa = ["prompts/*.md", "templates/*.html", "static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
